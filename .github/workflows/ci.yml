name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Build & Health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome (Format & Lint)
        run: pnpm exec biome ci .

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Build Libraries
        run: pnpm build

      - name: Check Package Health (Publint, ATTW, Size)
        run: |
          pnpm check:publint
          pnpm check:attw
          pnpm check:size